<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIFTY 50 Widget</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#ffffff;
    font-family:'Space Grotesk',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.widget {

    width: 92vw;
    height: 82vh;

    background: #ffffff;

    border: 1px solid #e5e5e5;

    border-radius: 32px;

    padding: 42px;

    box-sizing: border-box;

    display: flex;

    flex-direction: column;

    justify-content: center;

    gap: 22px;
}

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.label{
    color:#6b6b6f;
    font-size:clamp(18px,1.5vw,28px);
    font-weight:500;
    letter-spacing:1px;
    text-transform:uppercase;
}

.market-state{
    font-size:clamp(10px,0.9vw,13px);
    font-weight:500;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:#9a9a9e;
    border:1px solid #e5e5e5;
    border-radius:20px;
    padding:3px 10px;
}

.refresh-btn{
    width:28px;
    height:28px;
    border:1px solid #e5e5e5;
    border-radius:50%;
    background:#fff;
    cursor:pointer;
    color:#777;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.refresh-btn:hover{
    background:#f7f7f7;
}

.price {

    color: #111111;

    font-size: clamp(42px, 5vw, 72px);

    font-weight: 700;

    line-height: 1.1;

    letter-spacing: -2px;

    font-variant-numeric:
      tabular-nums lining-nums;

    white-space: nowrap;
}

.change-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    font-size:clamp(16px,1.6vw,22px);
    font-weight:500;
    font-variant-numeric: tabular-nums lining-nums;
}

.change-row .updated{
    color:#9a9a9e;
    font-size:clamp(12px,1vw,15px);
    font-weight:400;
}

.stats-row{
    display:flex;
    gap:32px;
    font-size:clamp(13px,1.1vw,16px);
    color:#9a9a9e;
    font-variant-numeric: tabular-nums lining-nums;
}

.stats-row .stat span{
    display:block;
    color:#111111;
    font-weight:500;
    margin-top:2px;
}

</style>

</head>

<body>

<div class="widget">

    <div class="header">

        <div class="header-left">
            <div class="label">
                NIFTY 50
            </div>
        </div>

        <div style="display:flex;align-items:center;gap:10px;">
            <div class="market-state" id="marketState">—</div>
            <button
                class="refresh-btn"
                onclick="fetchPrice()">
                ↻
            </button>
        </div>

    </div>

    <div
        class="price"
        id="price">
        Loading...
    </div>

    <div class="change-row">
        <span id="change">—</span>
        <span class="updated" id="updated"></span>
    </div>

    <div class="stats-row">
        <div class="stat">Day High<span id="dayHigh">—</span></div>
        <div class="stat">Day Low<span id="dayLow">—</span></div>
        <div class="stat">Prev Close<span id="prevClose">—</span></div>
    </div>

</div>

<script>

// Same-project relative path — Vercel serves api/nifty.js at /api/nifty automatically.
const PROXY_URL = '/api/nifty';

const fmt = (n) => Number(n).toLocaleString('en-IN', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
});

async function fetchPrice(){

    try{

        const response = await fetch(PROXY_URL + '?t=' + Date.now());

        if(!response.ok) throw new Error();

        const d = await response.json();

        if(d.price === null || isNaN(d.price)){
            throw new Error();
        }

        const priceEl = document.getElementById('price');
        priceEl.innerText = fmt(d.price);

        const isUp = d.change >= 0;
        priceEl.style.color = isUp
            ? (d.change === 0 ? '#111111' : '#16a34a')
            : '#dc2626';

        const changeEl = document.getElementById('change');
        changeEl.innerText =
            (isUp ? '+' : '') + fmt(d.change) +
            ' (' + (isUp ? '+' : '') + d.changePct.toFixed(2) + '%)';
        changeEl.style.color = priceEl.style.color;

        document.getElementById('dayHigh').innerText = fmt(d.dayHigh);
        document.getElementById('dayLow').innerText = fmt(d.dayLow);
        document.getElementById('prevClose').innerText = fmt(d.prevClose);

        const stateEl = document.getElementById('marketState');
        const state = (d.marketState || '').toUpperCase();
        stateEl.innerText = state === 'REGULAR' ? 'Open' : (state || '—');

        document.getElementById('updated').innerText =
            'Updated ' + new Date(d.updatedAt).toLocaleTimeString('en-IN', {
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });

    }

    catch(error){

        console.error(error);

        document
        .getElementById('price')
        .innerText =
        'Unavailable';
    }
}

fetchPrice();

setInterval(
    fetchPrice,
    15000
);

</script>

</body>
</html>
