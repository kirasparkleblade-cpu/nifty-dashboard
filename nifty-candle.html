<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nifty Candle</title>
<style>
  :root{
    --bg: #FFFFFF;
    --panel: #F7F7F5;
    --border: #E9E9E7;
    --text: #37352F;
    --muted: #9B9A97;
    --bull: #0F7B4D;
    --bull-soft: #DDF3E4;
    --bear: #C4362E;
    --bear-soft: #FBE4E1;
    --accent: #2383E2;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }
  #card{
    display:flex; flex-direction:column;
    height:100vh; width:100vw;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  /* --- Header: symbol + price + change badge, styled like a heatmap tile --- */
  #header{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px 10px 16px;
    flex-wrap: wrap;
  }
  #header .sym{
    font-weight:700; font-size:15px; letter-spacing:0.1px;
  }
  #header .price{
    font-family: var(--font-mono);
    font-size:20px; font-weight:700;
  }
  .badge{
    display:inline-flex; align-items:center; justify-content:center;
    font-family: var(--font-mono);
    font-size:12.5px; font-weight:700;
    padding: 3px 9px;
    border-radius: 6px;
    color:#fff;
  }
  .badge.up{ background: var(--bull); }
  .badge.down{ background: var(--bear); }
  #header .spacer{ flex:1; }
  #header .asof{ color: var(--muted); font-size:11.5px; font-family: var(--font-mono); }

  /* --- OHLCV strip --- */
  #ohlcv{
    display:flex; gap:18px; flex-wrap:wrap;
    padding: 0 16px 12px 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  #ohlcv b{ color: var(--text); font-weight:600; margin-left:4px; }

  /* --- Controls --- */
  #controls{
    display:flex; align-items:center; gap:6px;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    font-size: 12px;
  }
  #controls label{ color: var(--muted); }
  #controls input, #controls select{
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 8px;
    font-size: 12px;
    font-family: var(--font-mono);
  }
  #controls input{ width: 84px; }
  #controls button{
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 6px 13px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  #controls button:hover{ opacity: 0.85; }
  #controls .status{ color: var(--muted); margin-left: auto; font-family: var(--font-mono); font-size:11px; }

  /* --- Chart area --- */
  #chartWrap{
    flex:1;
    position: relative;
    background: var(--bg);
    min-height: 0;
  }
  canvas{ display:block; width:100%; height:100%; }

  #tooltip{
    position:absolute;
    pointer-events:none;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 2px 8px rgba(15,15,15,0.08);
    padding: 8px 10px;
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--text);
    display:none;
    z-index: 5;
    white-space: nowrap;
  }
  #tooltip .row b{ color: var(--muted); font-weight:500; display:inline-block; width:34px; }

  #error{
    position:absolute; top:12px; left:50%; transform: translateX(-50%);
    background: var(--bear-soft); border:1px solid var(--bear); color:#7A1F19;
    padding:10px 16px; border-radius:6px; font-size:12.5px; max-width: 82%;
    display:none; text-align:center; z-index: 10;
  }

  #loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color: var(--muted); font-size:13px; font-family: var(--font-mono);
  }

  ::selection{ background: var(--bull-soft); }
</style>
</head>
<body>
<div id="card">
  <div id="header">
    <span class="sym" id="tSym">NIFTY 50</span>
    <span class="price" id="tPrice">—</span>
    <span class="badge" id="tChg">—</span>
    <span class="spacer"></span>
    <span class="asof" id="tTime">—</span>
  </div>

  <div id="ohlcv">
    <span>O<b id="tO">—</b></span>
    <span>H<b id="tH">—</b></span>
    <span>L<b id="tL">—</b></span>
    <span>C<b id="tC">—</b></span>
    <span>Vol<b id="tV">—</b></span>
  </div>

  <div id="controls">
    <label>Symbol</label>
    <input id="inSymbol" type="text" value="^NSEI" spellcheck="false" />
    <label>Interval</label>
    <select id="inInterval">
      <option value="5m">5m</option>
      <option value="15m">15m</option>
      <option value="30m" selected>30m</option>
      <option value="60m">1h</option>
      <option value="1d">1d</option>
    </select>
    <label>Range</label>
    <select id="inRange">
      <option value="5d">5d</option>
      <option value="1mo" selected>1mo</option>
      <option value="3mo">3mo</option>
      <option value="6mo">6mo</option>
      <option value="1y">1y</option>
    </select>
    <button id="btnLoad">Load</button>
    <span class="status" id="status"></span>
  </div>

  <div id="chartWrap">
    <div id="loading">Loading chart…</div>
    <div id="error"></div>
    <canvas id="chart"></canvas>
    <div id="tooltip"></div>
  </div>
</div>

<script src="./nifty-candle.js"></script>
</body>
</html>
